version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build(deps)'
    groups:
      dev-dependencies:
        patterns:
          - '*'
    ignore:
      # typescript-eslint peers typescript at <6.1, so a major bump here breaks
      # the lint step. Raise this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
